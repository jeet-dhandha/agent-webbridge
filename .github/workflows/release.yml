name: release

# Cuts a release when you push a version tag (e.g. `git tag v1.0.0 && git push --tags`),
# or on manual dispatch. It gates on the browser-free daemon contract test, builds the
# downloadable extension zip (for "Load unpacked"; the Chrome Web Store build is uploaded separately by hand),
# creates a GitHub Release with that zip + INSTALL.md attached, and (if an NPM_TOKEN secret
# is configured) publishes the npm package.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Mapped here because the `secrets` context is not allowed in step `if:`
      # conditionals (it fails workflow validation). We gate on `env.NPM_TOKEN`.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Full test suite (browser-free gates)
        run: npm test

      - name: Build extension zip (for Load unpacked)
        run: node scripts/pack-extension.mjs

      - name: Create GitHub Release with the extension zip + install guide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          gh release create "v${VERSION}" \
            dist/agent-webbridge-extension-*.zip INSTALL.md \
            --title "v${VERSION}" \
            --generate-notes \
            || gh release upload "v${VERSION}" dist/agent-webbridge-extension-*.zip INSTALL.md --clobber

      - name: Publish to npm (only if NPM_TOKEN is set)
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Publish to AUR (only if AUR_SSH_PRIVATE_KEY is set)
        if: ${{ env.AUR_SSH_PRIVATE_KEY != '' }}
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$AUR_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519,rsa aur.archlinux.org >> ~/.ssh/known_hosts
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur" git clone ssh://aur@aur.archlinux.org/nodejs-agent-webbridge.git /tmp/aur-repo
          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO /tmp/aur-repo/
          cd /tmp/aur-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="$(node -p "require('$GITHUB_WORKSPACE/package.json').version")"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to v${VERSION}" || true
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur" git push origin master
